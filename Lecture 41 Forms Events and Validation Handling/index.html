<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <form action="" id="form">
        <div>

            <label for="username">Name:</label>
            <input type="text" id="username" placeholder="Enter your username">
            <span class="error-message" style="color: red;"></span>
        </div>

        <div>
            <label for="email">Email:</label>
            <input type="email" id="email" placeholder="Enter your email">
            <span class="error-message" style="color: red;"></span>
        </div>

        <div>
            <label for="password">Password:</label>
            <input type="password" id="password" placeholder="Enter your password">
            <span class="error-message" style="color: red;"></span>
        </div>

        <p id="password-hint" class="hidden">Must be at least 8 character</p>

        <div>
            <label for="bio">Bio:</label>
            <textarea type="text" id="bio" placeholder="Enter you bio..."></textarea>
            <p id="char-count"></p>
            <span class="error-message" style="color: red;"></span>
        </div>

        <div>
            <label for="select">Select your country:</label>
            <select name="country" id="country">
                <option value="india">India</option>
                <option value="usa">USA</option>
                <option value="uk">UK</option>
            </select>
            <span class="error-message" style="color: red;"></span>
        </div>

        <div>
            <input type="checkbox" id="check-box">
            <label for="check-box">I agreed to the terms and condition </label>
            <span class="error-message" style="color: red;"></span>
        </div>

        <button id="btn">Create Account</button>

    </form>
    <h1 class="hidden">Account created successfully</h1>

    <script src="index.js"></script>
</body>

</html>
